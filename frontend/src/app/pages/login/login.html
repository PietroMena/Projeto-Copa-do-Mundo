<div class="login-page">
  <div class="login-card">
    <div class="login-logo">
      <span class="logo-icon">⚽</span>
      <h1>Copa do Mundo</h1>
      <p>Painel Administrativo</p>
    </div>

    <div class="erro-msg" *ngIf="erro">{{ erro }}</div>

    <div class="form-group">
      <label for="login">Login</label>
      <input
        id="login"
        type="text"
        [(ngModel)]="loginData.login"
        placeholder="seu login"
        (keydown.enter)="entrar()"
      />
    </div>

    <div class="form-group">
      <label for="senha">Senha</label>
      <input
        id="senha"
        type="password"
        [(ngModel)]="loginData.senha"
        placeholder="••••••"
        (keydown.enter)="entrar()"
      />
    </div>

    <button class="btn-entrar" (click)="entrar()" [disabled]="carregando">
      <span *ngIf="carregando" class="spinner"></span>
      <span *ngIf="!carregando">Entrar</span>
    </button>
  </div>
</div>
